[pytest]
# The monitor's code lives under .claude/skills/wiki-monitor/, which pytest's
# default norecursedirs (`.*`) would skip.  Override it rather than moving the
# code out of the skill directory.
norecursedirs = site .git .venv __pycache__ node_modules
testpaths = .claude/skills/wiki-monitor/tests
pythonpath = .claude/skills/wiki-monitor
