name: Salmonella Wiki Monitor

# The monitor is a local tool: someone runs the wiki-monitor skill and reads the
# digest it produces. This workflow exists only as an optional unattended copy of
# that — it renders a digest and attaches it to the run. It sends no email and it
# records nothing, so it can never retire a finding nobody has read.
#
# Manual only, deliberately. A cron would produce digests that pile up unread,
# and the scan window is anchored to state, which this workflow never writes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-monitor
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The first-run scan window comes from the last commit touching
          # docs/serovars/, which a shallow clone would not contain.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the monitor
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # `prompt` accepts a skill invocation for a skill under .claude/skills/,
          # which is why checkout runs first.
          prompt: "/wiki-monitor"
          claude_args: |
            --allowedTools Bash,Read,Glob,Grep,Write,Edit,WebFetch
            --max-turns 80
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}

      # A run that finished without producing a digest did not do its job, even if
      # every step above reported success — the agent can stop early or exhaust its
      # turns. A quiet week is not that: a zero-finding run still renders a digest
      # saying so, so the absence of one is unambiguous.
      - name: Verify a digest was produced
        run: |
          set -euo pipefail
          if [ ! -f digest.html ]; then
            echo "::error::No digest was produced. A quiet week still renders one."
            exit 1
          fi
          echo "Digest present."

      - name: Attach the digest to this run
        if: always() && hashFiles('digest.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: |
            digest.html
            candidates.json
            findings.json
          if-no-files-found: warn
